  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="10" font-weight="500">
    <!-- Pill 1 -->
    <rect x="40" y="218" width="178" height="26" rx="5" fill="#181816"/>
    <text x="52" y="235" fill="#EAE7DF">SAM 3.1 + @meta-sam/parser</text>
    <!-- Pill 2 -->
    <rect x="226" y="218" width="210" height="26" rx="5" fill="#181816"/>
    <text x="238" y="235" fill="#EAE7DF">Muse Voice 1.0 + Muse Spark 1.3</text>
    <!-- Pill 3 -->
    <rect x="40" y="252" width="214" height="26" rx="5" fill="#181816"/>
    <text x="52" y="269" fill="#EAE7DF">Muse Spark Open 1026 (Baseten)</text>
    <!-- Pill 4 -->
    <rect x="262" y="252" width="222" height="26" rx="5" fill="#181816"/>
    <text x="274" y="269" fill="#EAE7DF">CLI + 4-Tool MCP + Workbench</text>
  </g>

  <!-- Bottom-left: Benchmark Summary Line -->
  <text x="40" y="310" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="11" fill="#4A4843">138 tests · 21 clips · 0.0% false-pass · 1.11% MAE · 480ms</text>
  <text x="40" y="328" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="10" fill="#B8B4A9">σ_noise = 0.45% · 3σ = 1.35% · δ = 4.10% · 8-frame 4FPS cap</text>

  <!-- ============================================================ -->
  <!-- RIGHT PANEL (x=640..1200) — "The Catch" Technical Diagram    -->
  <!-- ============================================================ -->
  <g clip-path="url(#right-panel-clip)">

    <!-- Section Title -->
    <rect x="660" y="28" width="184" height="22" rx="3" fill="#E05246"/>
    <text x="670" y="43" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#FFFFFF" letter-spacing="0.06em">THE CATCH — WHY SPECTRA</text>

    <!-- === BOX 1: TRADITIONAL QA (Coral Border) === -->
    <rect x="660" y="60" width="260" height="82" rx="6" fill="#FFFFFF" stroke="#E05246" stroke-width="1.5"/>
    <rect x="660" y="60" width="260" height="20" rx="6" fill="#E05246"/>
    <rect x="660" y="73" width="260" height="7" fill="#E05246"/>
    <text x="672" y="75" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#FFFFFF" letter-spacing="0.08em">TRADITIONAL QA</text>

    <text x="672" y="98" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="9.5" fill="#181816">DOM Hit-Test (1080, 625):</text>
    <rect x="846" y="88" width="62" height="16" rx="3" fill="#E05246"/>
    <text x="854" y="100" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#FFFFFF">PASS ✗</text>

    <text x="672" y="116" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="9.5" fill="#181816">Flagship VLM Judge:</text>
    <rect x="812" y="106" width="62" height="16" rx="3" fill="#E05246"/>
    <text x="820" y="118" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#FFFFFF">PASS ✗</text>

    <text x="672" y="134" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="8" fill="#4A4843">94.4% + 61.1% False-Pass Rate</text>

    <!-- === BOX 2: SPECTRA DUAL-INSTRUMENT CATCH (Green Border) === -->
    <rect x="660" y="152" width="520" height="104" rx="6" fill="#FFFFFF" stroke="#2E7D52" stroke-width="1.5"/>
    <rect x="660" y="152" width="520" height="20" rx="6" fill="#2E7D52"/>
    <rect x="660" y="165" width="520" height="7" fill="#2E7D52"/>
    <text x="672" y="167" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#FFFFFF" letter-spacing="0.08em">SPECTRA DUAL-INSTRUMENT CATCH</text>

    <!-- Visual button representation -->
    <rect x="676" y="184" width="200" height="30" rx="4" fill="#2E7D52"/>
    <text x="710" y="204" font-family="'Host Grotesk', 'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Complete Checkout</text>
    <!-- 10% occluded area with hatch -->
    <rect x="676" y="211" width="200" height="3" rx="0" fill="url(#hatch-45)"/>
    <rect x="676" y="211" width="200" height="3" fill="#E05246" fill-opacity="0.3"/>

    <!-- Measurement callouts -->
    <text x="892" y="196" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="9" fill="#181816">bbox [910, 600, 340x50]</text>
    <text x="892" y="212" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="9" fill="#E05246" font-weight="600">9.60% LOSS > 1.35% 3σ</text>
    <text x="892" y="228" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="9" fill="#181816">REJECTED · 1,700 px occluded</text>

    <!-- Arrow pointing down to occlusion -->
    <line x1="776" y1="220" x2="776" y2="246" stroke="#E05246" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="680" y="248" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="8.5" fill="#4A4843">rSam=0.9080 · visRatio=0.9000 · Δ=0.80% &lt; 4.10%</text>

    <!-- === BOX 3: CLOSED-LOOP VERIFIED (Emerald) === -->
    <rect x="660" y="268" width="520" height="66" rx="6" fill="#FFFFFF" stroke="#2E7D52" stroke-width="1.5"/>
    <rect x="660" y="268" width="520" height="20" rx="6" fill="#181816"/>
    <rect x="660" y="281" width="520" height="7" fill="#181816"/>
    <text x="672" y="283" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#EAE7DF" letter-spacing="0.08em">CLOSED-LOOP VERIFIED — PASS #2</text>

    <!-- Repair arrow -->
    <text x="672" y="306" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="10" fill="#2E7D52" font-weight="700">→ muse-spark-open-1026 CSS patch</text>
    <text x="672" y="322" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="10" fill="#181816" font-weight="600">0.0% False-Pass · 1.11% MAE · 480ms · 100.0% Restored</text>

    <!-- Green checkmark -->
    <circle cx="1150" y="300" r="14" fill="#2E7D52"/>
    <text x="1142" y="305" font-family="system-ui, sans-serif" font-size="16" fill="#FFFFFF" font-weight="700">✓</text>

    <!-- Right side connector arrows between boxes -->
    <line x1="930" y1="142" x2="930" y2="152" stroke="#2E7D52" stroke-width="1.5"/>
    <polygon points="926,150 930,156 934,150" fill="#2E7D52"/>
    <line x1="930" y1="256" x2="930" y2="268" stroke="#181816" stroke-width="1.5"/>
    <polygon points="926,266 930,272 934,266" fill="#181816"/>
  </g>
</svg>

